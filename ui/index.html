<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OQIDA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 6.6 V15.4 M8.4 11.9 L12 15.5 L15.6 11.9"/></g>
    </svg>
    <span class="wordmark">OQIDA</span>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-view="main" role="tab" data-i18n="tab_main"></button>
    <button class="tab" data-view="settings" role="tab" data-i18n="tab_settings"></button>
  </nav>
  <div class="ver" id="verLabel"></div>
</header>

<div class="banner" id="updateBanner" hidden>
  <span id="updateBannerText"></span>
  <button class="link" id="updateBannerBtn" data-i18n="banner_go"></button>
</div>

<main>
  <!-- ダウンロード画面 -->
  <section class="view is-active" id="view-main">
    <div class="field-label" data-i18n="label_url"></div>
    <div class="url-row">
      <input id="urlInput" class="input url" type="text" spellcheck="false" autocomplete="off"
             data-i18n-ph="url_placeholder">
      <button class="btn ghost" id="pasteBtn" data-i18n="paste"></button>
    </div>

    <div class="controls">
      <div class="ctl">
        <div class="field-label" data-i18n="label_format"></div>
        <div class="seg" data-setting="format">
          <button data-value="mp4">MP4</button>
          <button data-value="mp3">MP3</button>
        </div>
      </div>
      <div class="ctl" id="ctlMp4">
        <div class="field-label" data-i18n="label_quality"></div>
        <div class="seg" data-setting="mp4_quality">
          <button data-value="best" data-i18n="q_best"></button>
          <button data-value="1080">1080p</button>
          <button data-value="720">720p</button>
          <button data-value="480">480p</button>
        </div>
      </div>
      <div class="ctl" id="ctlMp3" hidden>
        <div class="field-label" data-i18n="label_bitrate"></div>
        <div class="seg" data-setting="mp3_bitrate">
          <button data-value="320">320k</button>
          <button data-value="192">192k</button>
          <button data-value="128">128k</button>
        </div>
      </div>
      <div class="ctl grow">
        <div class="field-label" data-i18n="label_folder"></div>
        <div class="folder">
          <span class="path" id="folderPath"></span>
          <button class="link" id="folderChange" data-i18n="change"></button>
          <button class="link" id="folderOpen" data-i18n="open"></button>
        </div>
      </div>
      <button class="btn primary" id="startBtn" data-i18n="start"></button>
    </div>

    <div class="queue-head">
      <div class="field-label" id="queueLabel"></div>
      <button class="link" id="clearBtn" data-i18n="clear_done" hidden></button>
    </div>
    <div id="queue" class="queue"></div>
    <div class="empty" id="emptyBox" data-i18n="empty"></div>
  </section>

  <!-- 設定画面 -->
  <section class="view" id="view-settings">
    <div class="group">
      <h2 data-i18n="s_appearance"></h2>
      <div class="row">
        <div class="row-text"><div class="row-title" data-i18n="s_theme"></div></div>
        <div class="seg" data-setting="theme">
          <button data-value="dark" data-i18n="theme_dark"></button>
          <button data-value="light" data-i18n="theme_light"></button>
          <button data-value="system" data-i18n="theme_system"></button>
        </div>
      </div>
      <div class="row">
        <div class="row-text"><div class="row-title" data-i18n="s_language"></div></div>
        <div class="seg" data-setting="language">
          <button data-value="auto" data-i18n="lang_auto"></button>
          <button data-value="ja">日本語</button>
          <button data-value="en">English</button>
        </div>
      </div>
    </div>

    <div class="group" id="grpUpdate">
      <h2 data-i18n="s_update"></h2>
      <div class="row">
        <div class="row-text">
          <div class="row-title"><span data-i18n="s_app_update"></span> <span class="mono dim" id="appVer"></span></div>
          <div class="row-sub" id="appUpdText"></div>
          <div class="bar slim" id="appUpdBar" hidden><i></i></div>
          <pre class="notes" id="appUpdNotes" hidden></pre>
        </div>
        <button class="btn" id="appUpdBtn"></button>
      </div>
      <div class="row">
        <div class="row-text"><div class="row-title" data-i18n="s_auto_app"></div></div>
        <div class="seg" data-setting="auto_check_app" data-bool="1">
          <button data-value="true" data-i18n="on"></button>
          <button data-value="false" data-i18n="off"></button>
        </div>
      </div>
      <div class="row">
        <div class="row-text">
          <div class="row-title"><span data-i18n="s_ytdlp"></span> <span class="mono dim" id="ytVer"></span></div>
          <div class="row-sub" id="ytUpdText"></div>
        </div>
        <button class="btn" id="ytUpdBtn"></button>
      </div>
      <div class="row">
        <div class="row-text">
          <div class="row-title" data-i18n="s_auto_yt"></div>
          <div class="row-sub" data-i18n="s_auto_yt_sub"></div>
        </div>
        <div class="seg" data-setting="auto_update_ytdlp" data-bool="1">
          <button data-value="true" data-i18n="on"></button>
          <button data-value="false" data-i18n="off"></button>
        </div>
      </div>
    </div>

    <div class="group">
      <h2 data-i18n="s_download"></h2>
      <div class="row">
        <div class="row-text">
          <div class="row-title" data-i18n="s_cookies"></div>
          <div class="row-sub" data-i18n="s_cookies_sub"></div>
        </div>
        <div class="seg" data-setting="cookies_browser">
          <button data-value="none" data-i18n="cookies_none"></button>
          <button data-value="edge">Edge</button>
          <button data-value="chrome">Chrome</button>
          <button data-value="firefox">Firefox</button>
        </div>
      </div>
    </div>

    <div class="group">
      <h2 data-i18n="s_parts"></h2>
      <div id="parts"></div>
      <div class="row">
        <div class="row-text"><div class="row-title" data-i18n="s_datadir"></div></div>
        <button class="btn" id="dataDirBtn" data-i18n="open"></button>
      </div>
    </div>
  </section>
</main>

<!-- 初回セットアップ -->
<div class="overlay" id="setup" hidden>
  <div class="setup-card">
    <svg class="mark big" viewBox="0 0 24 24" width="44" height="44" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 6.6 V15.4 M8.4 11.9 L12 15.5 L15.6 11.9"/></g>
    </svg>
    <h1 data-i18n="setup_title"></h1>
    <p class="dim" data-i18n="setup_body"></p>
    <div class="setup-part" id="setupPart"></div>
    <div class="bar"><i id="setupBar"></i></div>
    <div class="mono dim small" id="setupNum"></div>
    <div class="setup-err" id="setupErr" hidden></div>
    <button class="btn primary" id="setupRetry" data-i18n="retry" hidden></button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
