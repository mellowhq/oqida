name: release

# タグ(v0.1.0 など)をpushすると、インストーラーを自動で作ってReleasesに載せる。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: バージョンを決める
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          python tools/set_version.py "$V"

      - name: 依存を入れる
        run: python -m pip install -r requirements.txt pyinstaller

      - name: 読み込みの簡易チェック
        run: python -c "import core.downloader, core.updater, core.tools, core.settings; print('import ok')"

      - name: exeを作る
        run: >
          pyinstaller --noconfirm --clean --windowed --name OQIDA
          --icon assets/oqida.ico --add-data "ui;ui" --add-data "assets;assets" main.py

      - name: インストーラーを作る
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\oqida.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: OQIDA-Setup
          path: dist/OQIDA-*-Setup.exe

      - name: Releasesに載せる
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OQIDA-*-Setup.exe
          generate_release_notes: true
