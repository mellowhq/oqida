name: release

# 使い方（かんたん）:
#   GitHubの「アクション」→ 左の「release」→ 右の「Run workflow」→
#   バージョン番号（例: 0.5.2）を入れて実行するだけ。
#   version.py の書き換え・タグ作成・ビルド・リリース作成まで全部自動でやります。
#
# （上級者向け）タグ v0.5.2 を直接pushしても、これまで通りビルドされます。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "新しいバージョン番号（例: 0.5.2）。vは付けない"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: バージョンを決める
        id: ver
        shell: bash
        run: |
          IN="${{ github.event.inputs.version }}"
          if [ -n "$IN" ]; then
            V="$IN"
          elif [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="0.0.0"
          fi
          V="${V#v}"            # 先頭に v が付いていても外す
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "バージョンは 0.5.2 のような形式で入れてください（入力: '$V'）"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          python tools/set_version.py "$V"

      - name: バージョンを記録（手動実行のとき）
        id: bump
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/version.py
          git commit -m "OQIDA ${{ steps.ver.outputs.version }}" || echo "バージョンの変更なし"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 依存を入れる
        run: python -m pip install -r requirements.txt pyinstaller

      - name: 読み込みの簡易チェック
        run: python -c "import core.downloader, core.updater, core.tools, core.settings; print('import ok')"

      - name: exeを作る
        run: >
          pyinstaller --noconfirm --clean --windowed --name OQIDA
          --icon assets/oqida.ico --add-data "ui;ui" --add-data "assets;assets" main.py

      - name: インストーラーを作る
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\oqida.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: OQIDA-Setup
          path: dist/OQIDA-*-Setup.exe

      - name: Releasesに載せる
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: OQIDA v${{ steps.ver.outputs.version }}
          target_commitish: ${{ steps.bump.outputs.sha || github.sha }}
          files: dist/OQIDA-*-Setup.exe
          generate_release_notes: true

  # macOS版（.dmg）。Windowsジョブがバージョンを記録・リリース作成したあとに続けて実行し、
  # 同じリリースに .dmg を追加する。こちらはコミットしない（バージョンの二重記録を避ける）。
  build-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: バージョンを決める
        id: ver
        shell: bash
        run: |
          IN="${{ github.event.inputs.version }}"
          if [ -n "$IN" ]; then V="$IN"
          elif [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"
          else V="0.0.0"; fi
          V="${V#v}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "バージョンは 0.5.2 のような形式で入れてください（入力: '$V'）"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          python tools/set_version.py "$V"     # このジョブ内だけ反映（コミットはしない）

      - name: 依存を入れる
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install pyobjc-framework-WebKit   # macOSの画面表示(WKWebView)に必要

      - name: 読み込みの簡易チェック
        run: python -c "import core.downloader, core.updater, core.tools, core.settings; print('import ok')"

      - name: アイコン(.icns)を作る
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/oqida.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) assets/oqida.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o oqida.icns

      - name: .appを作る
        run: >
          pyinstaller --noconfirm --clean --windowed --name OQIDA
          --icon oqida.icns --osx-bundle-identifier com.mellowhq.oqida
          --add-data "ui:ui" --add-data "assets:assets" main.py

      - name: 署名（ad-hoc）とdmg化
        run: |
          V="${{ steps.ver.outputs.version }}"
          # ad-hoc署名（証明書なしでも、特にApple Siliconで起動できるようにする）
          codesign --force --deep --sign - dist/OQIDA.app
          # インストーラ代わりの.dmg（アプリと「アプリケーション」フォルダへのショートカットを入れる）
          mkdir -p dmgroot
          cp -R dist/OQIDA.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "OQIDA" -srcfolder dmgroot -ov -format UDZO "dist/OQIDA-$V-mac.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: OQIDA-mac
          path: dist/OQIDA-*-mac.dmg

      - name: Releasesに追加する
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: OQIDA v${{ steps.ver.outputs.version }}
          files: dist/OQIDA-*-mac.dmg
