<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OQIDA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 6.6 V15.4 M8.4 11.9 L12 15.5 L15.6 11.9"/></g>
      </svg>
      <span class="wordmark">OQIDA</span>
    </div>
    <nav class="nav">
      <button class="nav-item is-active" data-view="main">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="tab_main"></span>
      </button>
      <button class="nav-item" data-view="gif">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10 9.5v5l4.2-2.5z" fill="currentColor"/></svg>
        <span data-i18n="tab_gif"></span>
      </button>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="16" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="8" cy="17" r="2.3" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>
        <span data-i18n="tab_settings"></span>
        <i class="dot" id="navDot" hidden></i>
      </button>
    </nav>
    <div class="side-foot" id="verLabel"></div>
  </aside>

  <main>
    <!-- ダウンロード -->
    <section class="view is-active" id="view-main">
      <h1 data-i18n="tab_main"></h1>

      <div class="urlbar">
        <input id="urlInput" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="url_placeholder">
        <button class="text-btn" id="pasteBtn" data-i18n="paste"></button>
      </div>

      <div class="toolbar">
        <label class="fld">
          <span data-i18n="label_format"></span>
          <select data-setting="format">
            <option value="mp4">MP4</option>
            <option value="mp3">MP3</option>
            <option value="gif">GIF</option>
          </select>
        </label>
        <label class="fld" id="ctlMp4">
          <span data-i18n="label_quality"></span>
          <select data-setting="mp4_quality">
            <option value="best" data-i18n="q_best"></option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
          </select>
        </label>
        <label class="fld" id="ctlMp3" hidden>
          <span data-i18n="label_bitrate"></span>
          <select data-setting="mp3_bitrate">
            <option value="320">320 kbps</option>
            <option value="192">192 kbps</option>
            <option value="128">128 kbps</option>
          </select>
        </label>
        <label class="fld" id="ctlGifStart" hidden>
          <span data-i18n="label_gif_start"></span>
          <input id="gifStart" type="text" inputmode="decimal" value="0:00" autocomplete="off" spellcheck="false">
        </label>
        <label class="fld" id="ctlGifEnd" hidden>
          <span data-i18n="label_gif_end"></span>
          <input id="gifEnd" type="text" inputmode="decimal" value="0:10" autocomplete="off" spellcheck="false">
        </label>
        <label class="fld" id="ctlGifLen" hidden>
          <span data-i18n="label_gif_len"></span>
          <input id="gifLen" type="text" inputmode="decimal" value="10" autocomplete="off" spellcheck="false">
        </label>
        <label class="fld" id="ctlGifWidth" hidden>
          <span data-i18n="label_gif_width"></span>
          <select data-setting="gif_width">
            <option value="320">320 px</option>
            <option value="480">480 px</option>
            <option value="640">640 px</option>
          </select>
        </label>
        <label class="fld" id="ctlGifFps" hidden>
          <span data-i18n="label_gif_fps"></span>
          <select data-setting="gif_fps">
            <option value="10">10 fps</option>
            <option value="15">15 fps</option>
            <option value="20">20 fps</option>
          </select>
        </label>
        <label class="fld" id="ctlSize">
          <span data-i18n="label_size_limit"></span>
          <select data-setting="size_limit_mb">
            <option value="0" data-i18n="size_none"></option>
            <option value="8">8 MB</option>
            <option value="10">10 MB</option>
            <option value="25">25 MB</option>
            <option value="50">50 MB</option>
            <option value="100">100 MB</option>
            <option value="500">500 MB</option>
            <option value="1000">1 GB</option>
          </select>
        </label>
        <button class="btn primary" id="startBtn" data-i18n="start"></button>
      </div>
      <p class="gif-note" id="gifNote" data-i18n="gif_hint" hidden></p>
      <p class="gif-note" id="sizeNote" data-i18n="size_note" hidden></p>

      <div class="savein">
        <span class="savein-label" data-i18n="label_folder"></span>
        <span class="path" id="folderPath"></span>
        <button class="link" id="folderChange" data-i18n="change"></button>
        <button class="link" id="folderOpen" data-i18n="open"></button>
      </div>

      <div class="list-head" id="dlHead">
        <h2 id="queueLabel"></h2>
        <button class="link" id="clearBtn" data-i18n="clear_done" hidden></button>
      </div>
      <div id="queue" class="queue"></div>
      <div class="empty" id="emptyBox">
        <p data-i18n="empty"></p>
        <p class="dim small" data-i18n="empty_sites"></p>
      </div>
    </section>

    <!-- GIF変換（パソコン内の動画） -->
    <section class="view" id="view-gif">
      <h1 data-i18n="tab_gif"></h1>

      <div class="drop" id="cvDrop">
        <div class="drop-text" id="cvFileName" data-i18n="cv_drop"></div>
        <div class="drop-sub dim small" id="cvFileMeta"></div>
        <button class="btn" id="cvPick" data-i18n="cv_pick"></button>
      </div>

      <div class="toolbar">
        <label class="fld">
          <span data-i18n="label_gif_start"></span>
          <input id="cvStart" type="text" inputmode="decimal" value="0:00" autocomplete="off" spellcheck="false">
        </label>
        <label class="fld">
          <span data-i18n="label_gif_end"></span>
          <input id="cvEnd" type="text" inputmode="decimal" value="0:10" autocomplete="off" spellcheck="false">
        </label>
        <label class="fld">
          <span data-i18n="label_gif_len"></span>
          <input id="cvLen" type="text" inputmode="decimal" value="10" autocomplete="off" spellcheck="false">
        </label>
        <label class="fld">
          <span data-i18n="label_gif_width"></span>
          <select data-setting="gif_width">
            <option value="320">320 px</option>
            <option value="480">480 px</option>
            <option value="640">640 px</option>
          </select>
        </label>
        <label class="fld">
          <span data-i18n="label_gif_fps"></span>
          <select data-setting="gif_fps">
            <option value="10">10 fps</option>
            <option value="15">15 fps</option>
            <option value="20">20 fps</option>
          </select>
        </label>
        <label class="fld" >
          <span data-i18n="label_size_limit"></span>
          <select data-setting="size_limit_mb">
            <option value="0" data-i18n="size_none"></option>
            <option value="8">8 MB</option>
            <option value="10">10 MB</option>
            <option value="25">25 MB</option>
            <option value="50">50 MB</option>
            <option value="100">100 MB</option>
            <option value="500">500 MB</option>
            <option value="1000">1 GB</option>
          </select>
        </label>
        <button class="btn primary" id="cvGo" data-i18n="cv_go" disabled></button>
      </div>
      <p class="gif-note" data-i18n="cv_hint"></p>
      <p class="gif-note" id="cvSizeNote" data-i18n="size_note" hidden></p>

      <div class="list-head" id="cvHead" hidden>
        <h2 id="cvLabel"></h2>
        <button class="link" id="cvClear" data-i18n="clear_done" hidden></button>
      </div>
      <div id="cvQueue" class="queue"></div>
    </section>

    <!-- 設定 -->
    <section class="view" id="view-settings">
      <h1 data-i18n="tab_settings"></h1>

      <h2 class="grp" data-i18n="s_appearance"></h2>
      <div class="panel">
        <div class="row">
          <div class="row-text"><div class="row-title" data-i18n="s_theme"></div></div>
          <select data-setting="theme">
            <option value="dark" data-i18n="theme_dark"></option>
            <option value="light" data-i18n="theme_light"></option>
            <option value="system" data-i18n="theme_system"></option>
          </select>
        </div>
        <div class="row">
          <div class="row-text"><div class="row-title" data-i18n="s_accent"></div></div>
          <div class="swatches" id="swatches">
            <label class="swatch custom" id="customSwatch" data-i18n-title="acc_custom">
              <input type="color" id="accentPicker" value="#ff8a3d">
            </label>
          </div>
        </div>
        <div class="row">
          <div class="row-text"><div class="row-title" data-i18n="s_language"></div></div>
          <select data-setting="language">
            <option value="auto" data-i18n="lang_auto"></option>
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>

      <h2 class="grp" id="grpUpdate" data-i18n="s_update"></h2>
      <div class="panel">
        <div class="row">
          <div class="row-text">
            <div class="row-title"><span data-i18n="s_app_update"></span> <span class="dim" id="appVer"></span></div>
            <div class="row-sub" id="appUpdText"></div>
            <div class="bar slim" id="appUpdBar" hidden><i></i></div>
            <pre class="notes" id="appUpdNotes" hidden></pre>
          </div>
          <button class="btn" id="appUpdBtn"></button>
        </div>
        <div class="row">
          <div class="row-text"><div class="row-title" data-i18n="s_auto_app"></div></div>
          <label class="switch"><input type="checkbox" data-setting="auto_check_app"><span></span></label>
        </div>
        <div class="row">
          <div class="row-text">
            <div class="row-title"><span data-i18n="s_ytdlp"></span> <span class="dim" id="ytVer"></span></div>
            <div class="row-sub" id="ytUpdText"></div>
          </div>
          <button class="btn" id="ytUpdBtn"></button>
        </div>
        <div class="row">
          <div class="row-text">
            <div class="row-title" data-i18n="s_auto_yt"></div>
            <div class="row-sub" data-i18n="s_auto_yt_sub"></div>
          </div>
          <label class="switch"><input type="checkbox" data-setting="auto_update_ytdlp"><span></span></label>
        </div>
      </div>

      <h2 class="grp" data-i18n="s_download"></h2>
      <div class="panel">
        <div class="row">
          <div class="row-text">
            <div class="row-title" data-i18n="s_cookies"></div>
            <div class="row-sub" data-i18n="s_cookies_sub"></div>
          </div>
          <select data-setting="cookies_browser">
            <option value="none" data-i18n="cookies_none"></option>
            <option value="edge">Edge</option>
            <option value="chrome">Chrome</option>
            <option value="firefox">Firefox</option>
          </select>
        </div>
      </div>

      <h2 class="grp" data-i18n="s_parts"></h2>
      <div class="panel">
        <div id="parts"></div>
        <div class="row">
          <div class="row-text"><div class="row-title" data-i18n="s_datadir"></div></div>
          <button class="btn" id="dataDirBtn" data-i18n="open"></button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 初回セットアップ -->
<div class="overlay" id="setup" hidden>
  <div class="setup-card">
    <svg class="mark big" viewBox="0 0 24 24" width="44" height="44" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 6.6 V15.4 M8.4 11.9 L12 15.5 L15.6 11.9"/></g>
    </svg>
    <h1 data-i18n="setup_title"></h1>
    <p class="dim" data-i18n="setup_body"></p>
    <div class="setup-part" id="setupPart"></div>
    <div class="bar"><i id="setupBar"></i></div>
    <div class="dim small num" id="setupNum"></div>
    <div class="setup-err" id="setupErr" hidden></div>
    <button class="btn primary" id="setupRetry" data-i18n="retry" hidden></button>
  </div>
</div>

<!-- 起動時のアップデート確認 -->
<div class="modal" id="updDialog" hidden role="dialog" aria-modal="true" aria-labelledby="updTitle">
  <div class="modal-card">
    <h2 id="updTitle" data-i18n="upd_dialog_title"></h2>
    <p id="updMsg" data-i18n="upd_dialog_msg"></p>
    <div class="bar" id="updProg" hidden><i></i></div>
    <div class="modal-actions">
      <button class="btn" id="updLater" data-i18n="upd_later"></button>
      <button class="btn primary" id="updNow" data-i18n="upd_now"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
